<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vocabulary Randomizer</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #222;
    }

    header {
        text-align: center;
        padding: 30px 20px 20px;
    }

    h1 {
        margin: 0 0 10px;
    }

    .subtitle {
        color: #666;
    }

    .container {
        width: min(900px, 90%);
        margin: auto;
    }

    .upload-section {
        text-align: center;
        margin: 25px 0;
    }

    input[type="file"] {
        display: none;
    }

    .button {
        border: none;
        padding: 12px 20px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
        margin: 5px;
    }

    .primary {
        background: #222;
        color: white;
    }

    .secondary {
        background: #ddd;
        color: #222;
    }

    .button:hover {
        opacity: 0.8;
    }

    .status {
        text-align: center;
        margin: 15px 0;
        color: #666;
    }

    .words-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
        margin-top: 20px;
    }

    .word-card {
        background: white;
        padding: 22px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 18px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        transition: transform 0.15s, background 0.15s;
        word-break: break-word;
    }

    .word-card:hover {
        transform: translateY(-3px);
        background: #f0f0f0;
    }

    .word-card.selected {
        background: #DDEEFF;
    }

    .next-section {
        text-align: center;
        margin: 30px 0;
    }

    .difficult-section {
        margin-top: 40px;
        padding-bottom: 50px;
    }

    .difficult-section h2 {
        text-align: center;
    }

    .difficult-list {
        background: white;
        border-radius: 12px;
        padding: 15px;
        min-height: 60px;
    }

    .difficult-word {
        padding: 12px;
        border-bottom: 1px solid #eee;
        cursor: pointer;
    }

    .difficult-word:last-child {
        border-bottom: none;
    }

    .difficult-word:hover {
        background: #f5f5f5;
    }

    .empty {
        text-align: center;
        color: #999;
        padding: 15px;
    }

    .hint {
        text-align: center;
        font-size: 14px;
        color: #777;
        margin-top: 8px;
    }

    @media (max-width: 600px) {
        .words-grid {
            grid-template-columns: 1fr;
        }

        .word-card {
            font-size: 17px;
        }
    }
</style>
</head>

<body>

<header>
    <h1>Vocabulary Randomizer</h1>
    <div class="subtitle">
        Six random words at a time. Words will not appear again once shown.
    </div>
</header>

<div class="container">

    <div class="upload-section">
        <label for="fileInput" class="button primary">
            Import Vocabulary File
        </label>

        <input type="file" id="fileInput" accept=".txt">

        <div class="hint">
            Your vocabulary is saved in this browser after importing.
        </div>
    </div>

    <div class="status" id="status">
        No vocabulary file loaded.
    </div>

    <div class="words-grid" id="wordsGrid"></div>

    <div class="next-section">
        <button class="button primary" id="nextButton">
            Show Next 6
        </button>

        <div class="hint">
            Tap a word to add it to Difficult Words.
        </div>
    </div>

    <div class="difficult-section">

        <h2>Difficult Words</h2>

        <div class="hint">
            Tap a word here to remove it from this list.
        </div>

        <div class="difficult-list" id="difficultList"></div>

    </div>

</div>

<script>

const fileInput = document.getElementById("fileInput");
const wordsGrid = document.getElementById("wordsGrid");
const difficultList = document.getElementById("difficultList");
const nextButton = document.getElementById("nextButton");
const status = document.getElementById("status");

let remainingWords = JSON.parse(
    localStorage.getItem("remainingWords")
) || [];

let difficultWords = JSON.parse(
    localStorage.getItem("difficultWords")
) || [];

let currentWords = JSON.parse(
    localStorage.getItem("currentWords")
) || [];


/* Fisher-Yates Shuffle */

function shuffle(array) {

    const newArray = [...array];

    for (let i = newArray.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [newArray[i], newArray[j]] =
            [newArray[j], newArray[i]];
    }

    return newArray;
}


/* Import TXT file */

fileInput.addEventListener("change", function(event) {

    const file = event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {

        const text = e.target.result;

        const words = text
            .split(/\r?\n/)
            .map(word => word.trim())
            .filter(word => word.length > 0);

        remainingWords = shuffle(words);

        currentWords = [];

        difficultWords = [];

        localStorage.setItem(
            "remainingWords",
            JSON.stringify(remainingWords)
        );

        localStorage.setItem(
            "currentWords",
            JSON.stringify(currentWords)
        );

        localStorage.setItem(
            "difficultWords",
            JSON.stringify(difficultWords)
        );

        showNextSix();

        renderDifficultWords();
    };

    reader.readAsText(file);

});


/* Show next 6 words */

function showNextSix() {

    if (remainingWords.length === 0) {

        wordsGrid.innerHTML = `
            <div class="empty">
                No more words remaining.
            </div>
        `;

        currentWords = [];

        localStorage.setItem(
            "currentWords",
            JSON.stringify(currentWords)
        );

        updateStatus();

        return;
    }


    currentWords = remainingWords.splice(0, 6);


    localStorage.setItem(
        "remainingWords",
        JSON.stringify(remainingWords)
    );

    localStorage.setItem(
        "currentWords",
        JSON.stringify(currentWords)
    );


    renderCurrentWords();

    updateStatus();
}


/* Render current words */

function renderCurrentWords() {

    wordsGrid.innerHTML = "";

    if (currentWords.length === 0) {

        wordsGrid.innerHTML = `
            <div class="empty">
                Import a vocabulary file to begin.
            </div>
        `;

        return;
    }


    currentWords.forEach(word => {

        const card = document.createElement("div");

        card.className = "word-card";

        if (difficultWords.includes(word)) {
            card.classList.add("selected");
        }

        card.textContent = word;


        card.addEventListener("click", function() {

            toggleDifficultWord(word);

            card.classList.toggle("selected");

        });


        wordsGrid.appendChild(card);

    });

}


/* Add / remove difficult word */

function toggleDifficultWord(word) {

    if (difficultWords.includes(word)) {

        difficultWords =
            difficultWords.filter(item => item !== word);

    } else {

        difficultWords.push(word);

    }


    localStorage.setItem(
        "difficultWords",
        JSON.stringify(difficultWords)
    );


    renderDifficultWords();

}


/* Render difficult words */

function renderDifficultWords() {

    difficultList.innerHTML = "";


    if (difficultWords.length === 0) {

        difficultList.innerHTML = `
            <div class="empty">
                No difficult words yet.
            </div>
        `;

        return;

    }


    difficultWords.forEach(word => {

        const item = document.createElement("div");

        item.className = "difficult-word";

        item.textContent = word;


        item.addEventListener("click", function() {

            difficultWords =
                difficultWords.filter(item => item !== word);


            localStorage.setItem(
                "difficultWords",
                JSON.stringify(difficultWords)
            );


            renderDifficultWords();

            renderCurrentWords();

        });


        difficultList.appendChild(item);

    });

}


/* Status */

function updateStatus() {

    if (remainingWords.length === 0 && currentWords.length === 0) {

        status.textContent = "No vocabulary file loaded.";

        return;

    }


    status.textContent =
        `${remainingWords.length} words remaining`;

}


/* Next button */

nextButton.addEventListener("click", function() {

    showNextSix();

});


/* Load saved data when the website opens */

renderCurrentWords();

renderDifficultWords();

updateStatus();

</script>

</body>
</html>
