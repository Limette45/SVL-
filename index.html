<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vocabulary Randomizer</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #222;
    }

    header {
        text-align: center;
        padding: 30px 20px 20px;
    }

    h1 {
        margin: 0 0 10px;
    }

    .subtitle {
        color: #666;
    }

    .container {
        width: min(900px, 90%);
        margin: auto;
    }

    /* Upload */

    .upload-section {
        text-align: center;
        margin: 25px 0;
    }

    input[type="file"] {
        display: none;
    }

    /* Buttons */

    .button {
        border: none;
        padding: 12px 20px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
        margin: 5px;
    }

    .primary {
        background: #222;
        color: white;
    }

    .button:hover {
        opacity: 0.8;
    }

    /* Status */

    .status {
        text-align: center;
        margin: 15px 0;
        color: #666;
    }

    /* Random words */

    .words-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
        margin-top: 20px;
    }

    .word-card {
        background: white;
        padding: 22px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 18px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        transition: transform 0.15s, background 0.15s;
        word-break: break-word;
    }

    .word-card:hover {
        transform: translateY(-3px);
        background: #f0f0f0;
    }

    /* Selected difficult word */

    .word-card.selected {
        background: #DFF3FF;
    }

    /* Next button */

    .next-section {
        text-align: center;
        margin: 30px 0;
    }

    /* Difficult words */

    .difficult-section {
        margin-top: 40px;
        padding-bottom: 50px;
    }

    .difficult-section h2 {
        text-align: center;
    }

    .difficult-list {
        background: white;
        border-radius: 12px;
        padding: 15px;
        min-height: 60px;
    }

    .difficult-word {
        padding: 12px;
        border-bottom: 1px solid #eee;
    }

    .difficult-word:last-child {
        border-bottom: none;
    }

    /* Empty message */

    .empty {
        text-align: center;
        color: #999;
        padding: 15px;
    }

    /* Hint */

    .hint {
        text-align: center;
        font-size: 14px;
        color: #777;
        margin-top: 8px;
    }

    /* Mobile */

    @media (max-width: 600px) {

        .words-grid {
            grid-template-columns: 1fr;
        }

        .word-card {
            font-size: 17px;
        }

    }

</style>
</head>


<body>


<header>

    <h1>Vocabulary Randomizer</h1>

    <div class="subtitle">
        Six random words at a time. Words will not appear again once shown.
    </div>

</header>


<div class="container">


    <!-- Import vocabulary -->

    <div class="upload-section">

        <label for="fileInput" class="button primary">
            Import Vocabulary File
        </label>

        <input
            type="file"
            id="fileInput"
            accept=".txt"
        >

        <div class="hint">
            Your vocabulary is saved in this browser after importing.
        </div>

    </div>


    <!-- Status -->

    <div class="status" id="status">
        No vocabulary file loaded.
    </div>


    <!-- Random 6 -->

    <div
        class="words-grid"
        id="wordsGrid"
    ></div>


    <!-- Next 6 -->

    <div class="next-section">

        <button
            class="button primary"
            id="nextButton"
        >
            Show Next 6
        </button>

        <div class="hint">
            Tap a word to add or remove it from Difficult Words.
        </div>

    </div>


    <!-- Difficult words -->

    <div class="difficult-section">

        <h2>Vocab List</h2>

        <div class="hint">
            This list cannot be edited by tapping the words below.
        </div>

        <div
            class="difficult-list"
            id="difficultList"
        ></div>

    </div>


</div>


<script>


/* Elements */

const fileInput = document.getElementById("fileInput");
const wordsGrid = document.getElementById("wordsGrid");
const difficultList = document.getElementById("difficultList");
const nextButton = document.getElementById("nextButton");
const status = document.getElementById("status");


/* Load saved data */

let remainingWords = JSON.parse(
    localStorage.getItem("remainingWords")
) || [];


let difficultWords = JSON.parse(
    localStorage.getItem("difficultWords")
) || [];


let currentWords = JSON.parse(
    localStorage.getItem("currentWords")
) || [];


/* Fisher-Yates Shuffle */

function shuffle(array) {

    const newArray = [...array];

    for (let i = newArray.length - 1; i > 0; i--) {

        const j = Math.floor(
            Math.random() * (i + 1)
        );

        [newArray[i], newArray[j]] =
            [newArray[j], newArray[i]];

    }

    return newArray;

}


/* Import TXT file */

fileInput.addEventListener(
    "change",
    function(event) {

        const file = event.target.files[0];

        if (!file) return;


        const reader = new FileReader();


        reader.onload = function(e) {

            const text = e.target.result;


            /* Each line = one vocabulary entry */

            const words = text
                .split(/\r?\n/)
                .map(word => word.trim())
                .filter(word => word.length > 0);


            /* Shuffle all words */

            remainingWords = shuffle(words);


            /* Clear current words */

            currentWords = [];


            /* New file = new difficult words list */

            difficultWords = [];


            /* Save */

            localStorage.setItem(
                "remainingWords",
                JSON.stringify(remainingWords)
            );


            localStorage.setItem(
                "currentWords",
                JSON.stringify(currentWords)
            );


            localStorage.setItem(
                "difficultWords",
                JSON.stringify(difficultWords)
            );


            /* Show first 6 */

            showNextSix();


            renderDifficultWords();

        };


        reader.readAsText(file);

    }
);


/* Show next 6 */

function showNextSix() {


    /* No words left */

    if (remainingWords.length === 0) {

        currentWords = [];


        localStorage.setItem(
            "currentWords",
            JSON.stringify(currentWords)
        );


        wordsGrid.innerHTML = `
            <div class="empty">
                No more words remaining.
            </div>
        `;


        updateStatus();

        return;

    }


    /* Take up to 6 words */

    currentWords = remainingWords.splice(0, 6);


    /* Save remaining words */

    localStorage.setItem(
        "remainingWords",
        JSON.stringify(remainingWords)
    );


    /* Save current words */

    localStorage.setItem(
        "currentWords",
        JSON.stringify(currentWords)
    );


    renderCurrentWords();

    updateStatus();

}


/* Render current 6 words */

function renderCurrentWords() {


    wordsGrid.innerHTML = "";


    /* No vocabulary */

    if (currentWords.length === 0) {

        wordsGrid.innerHTML = `
            <div class="empty">
                Import a vocabulary file to begin.
            </div>
        `;

        return;

    }


    currentWords.forEach(word => {


        const card = document.createElement("div");

        card.className = "word-card";


        /* If already difficult, show blue */

        if (difficultWords.includes(word)) {

            card.classList.add("selected");

        }


        card.textContent = word;


        /* Random 6 cards can toggle ON/OFF */

        card.addEventListener(
            "click",
            function() {

                toggleDifficultWord(word);

                renderCurrentWords();

            }
        );


        wordsGrid.appendChild(card);

    });

}


/* Toggle Difficult Word */

function toggleDifficultWord(word) {


    /* Already in Difficult Words → remove */

    if (difficultWords.includes(word)) {

        difficultWords =
            difficultWords.filter(
                item => item !== word
            );

    }


    /* Not in Difficult Words → add */

    else {

        difficultWords.push(word);

    }


    /* Save */

    localStorage.setItem(
        "difficultWords",
        JSON.stringify(difficultWords)
    );


    /* Update list */

    renderDifficultWords();

}


/* Render Difficult Words */

function renderDifficultWords() {


    difficultList.innerHTML = "";


    /* Empty list */

    if (difficultWords.length === 0) {

        difficultList.innerHTML = `
            <div class="empty">
                No difficult words yet.
            </div>
        `;

        return;

    }


    difficultWords.forEach(word => {


        const item = document.createElement("div");

        item.className = "difficult-word";

        item.textContent = word;


        /*
        No click event here.

        Difficult Words below cannot
        be removed or changed by tapping.
        */


        difficultList.appendChild(item);

    });

}


/* Update status */

function updateStatus() {


    const totalVisible =
        remainingWords.length + currentWords.length;


    if (totalVisible === 0) {

        status.textContent =
            "No more words remaining.";

        return;

    }


    status.textContent =
        `${remainingWords.length} words remaining`;

}


/* Show next 6 button */

nextButton.addEventListener(
    "click",
    function() {

        showNextSix();

    }
);


/* Load saved data */

renderCurrentWords();

renderDifficultWords();

updateStatus();


</script>


</body>
</html>
