<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Randomizer</title>
<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f5f5f5;
    color: #222;
}

.container {
    max-width: 900px;
    margin: 0 auto;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

.page-navigation {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 20px;
}

.page-button {
    padding: 10px 16px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: white;
    cursor: pointer;
    font-size: 16px;
}

.page-button.active {
    background: #333;
    color: white;
    border-color: #333;
}

.page-name-input {
    width: 100%;
    padding: 10px;
    margin-bottom: 16px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 16px;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
}

button,
.file-label {
    padding: 10px 16px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: white;
    cursor: pointer;
    font-size: 15px;
}

button:hover,
.file-label:hover,
.page-button:hover {
    background: #eaeaea;
}

#fileInput {
    display: none;
}

.status {
    margin: 12px 0;
    color: #555;
}

.words-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin: 20px 0;
}

.word-card {
    padding: 16px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: white;
    cursor: pointer;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    min-height: 60px;
}

.word-card.difficult {
    background: #fff0f0;
    border-color: #d88;
}

.section-title {
    margin-top: 28px;
    padding-bottom: 8px;
    border-bottom: 1px solid #ccc;
}

.difficult-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 12px;
}

.difficult-word {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 6px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.difficult-word span {
    flex: 1;
}

.remove-button {
    flex-shrink: 0;
}

@media (max-width: 600px) {
    body {
        padding: 12px;
    }

    .words-grid {
        grid-template-columns: 1fr;
    }

    .page-button {
        padding: 9px 12px;
    }
}
</style>
</head>
<body>
<div class="container">
    <h1>Vocabulary Randomizer</h1>

    <div id="pageNavigation" class="page-navigation"></div>

    <input
        id="pageNameInput"
        class="page-name-input"
        type="text"
        placeholder="Page name"
    >

    <div class="controls">
        <label class="file-label" for="fileInput">Import Vocabulary File</label>
        <input id="fileInput" type="file" accept=".txt,text/plain">
        <button id="nextButton" type="button">Show Next 6</button>
    </div>

    <div id="status" class="status"></div>
    <div id="wordsGrid" class="words-grid"></div>

    <h2 class="section-title">Difficult Words</h2>
    <div id="difficultList" class="difficult-list"></div>
</div>

<script>
const TOTAL_PAGES = 7;

let currentPage = Number(localStorage.getItem("vocabularyCurrentPage")) || 1;
let pageNames = JSON.parse(localStorage.getItem("vocabularyPageNames")) || {};

let remainingWords = [];
let currentWords = [];
let difficultWords = [];

function getStorageKey(type, page = currentPage) {
    return `vocabularyPage${page}_${type}`;
}

function saveCurrentPageData() {
    localStorage.setItem(getStorageKey("remainingWords"), JSON.stringify(remainingWords));
    localStorage.setItem(getStorageKey("currentWords"), JSON.stringify(currentWords));
    localStorage.setItem(getStorageKey("difficultWords"), JSON.stringify(difficultWords));
}

function loadCurrentPageData() {
    remainingWords = JSON.parse(localStorage.getItem(getStorageKey("remainingWords"))) || [];
    currentWords = JSON.parse(localStorage.getItem(getStorageKey("currentWords"))) || [];
    difficultWords = JSON.parse(localStorage.getItem(getStorageKey("difficultWords"))) || [];

    renderCurrentWords();
    renderDifficultWords();
    updateStatus();
}

function migrateOldData() {
    if (localStorage.getItem("vocabularyOldDataMigrated") === "true") {
        return;
    }

    const oldRemainingWords = localStorage.getItem("remainingWords");
    const oldCurrentWords = localStorage.getItem("currentWords");
    const oldDifficultWords = localStorage.getItem("difficultWords");

    if (oldRemainingWords !== null &&
        localStorage.getItem(getStorageKey("remainingWords", 1)) === null) {
        localStorage.setItem(getStorageKey("remainingWords", 1), oldRemainingWords);
    }

    if (oldCurrentWords !== null &&
        localStorage.getItem(getStorageKey("currentWords", 1)) === null) {
        localStorage.setItem(getStorageKey("currentWords", 1), oldCurrentWords);
    }

    if (oldDifficultWords !== null &&
        localStorage.getItem(getStorageKey("difficultWords", 1)) === null) {
        localStorage.setItem(getStorageKey("difficultWords", 1), oldDifficultWords);
    }

    localStorage.setItem("vocabularyOldDataMigrated", "true");
}

function savePageNames() {
    localStorage.setItem("vocabularyPageNames", JSON.stringify(pageNames));
}

function renderPageNavigation() {
    const navigation = document.getElementById("pageNavigation");
    navigation.innerHTML = "";

    for (let page = 1; page <= TOTAL_PAGES; page++) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "page-button";
        button.textContent = pageNames[page] || `Page ${page}`;

        if (page === currentPage) {
            button.classList.add("active");
        }

        button.addEventListener("click", () => {
            currentPage = page;
            localStorage.setItem("vocabularyCurrentPage", String(currentPage));
            renderPageNavigation();
            document.getElementById("pageNameInput").value = pageNames[currentPage] || "";
            loadCurrentPageData();
        });

        navigation.appendChild(button);
    }

    document.getElementById("pageNameInput").value = pageNames[currentPage] || "";
}

document.getElementById("pageNameInput").addEventListener("change", function () {
    const name = this.value.trim();

    if (name) {
        pageNames[currentPage] = name;
    } else {
        delete pageNames[currentPage];
    }

    savePageNames();
    renderPageNavigation();
});

function shuffle(array) {
    const result = [...array];

    for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
    }

    return result;
}

document.getElementById("fileInput").addEventListener("change", function (event) {
    const file = event.target.files[0];

    if (!file) {
        return;
    }

    const reader = new FileReader();

    reader.onload = function (e) {
        let words = e.target.result
            .split(/\r?\n/)
            .map(word => word.trim())
            .filter(word => word.length > 0);

        if (currentPage >= 2 && currentPage <= 5) {
            words = words.map(word => {
                const match = word.match(/^(.+?)\s{2,}(.+)$/);

                if (match) {
                    return match[1].trim() + "     " + match[2].trim();
                }

                return word;
            });
        }

        if (currentPage >= 6 && currentPage <= 7) {
            words = words.map(word => {
                const match = word.match(/^(.+?)\s+\((.+)\)$/);

                if (match) {
                    return match[1].trim() + "        (" + match[2].trim() + ")";
                }

                return word;
            });
        }

        remainingWords = shuffle(words);
        currentWords = [];
        difficultWords = [];

        saveCurrentPageData();
        showNextSix();
        renderDifficultWords();
        updateStatus();

        event.target.value = "";
    };

    reader.readAsText(file);
});

document.getElementById("nextButton").addEventListener("click", showNextSix);

function showNextSix() {
    currentWords = remainingWords.splice(0, 6);

    saveCurrentPageData();
    renderCurrentWords();
    updateStatus();
}

function renderCurrentWords() {
    const grid = document.getElementById("wordsGrid");
    grid.innerHTML = "";

    currentWords.forEach(word => {
        const card = document.createElement("div");
        card.className = "word-card";

        if (difficultWords.includes(word)) {
            card.classList.add("difficult");
        }

        card.textContent = word;

        card.addEventListener("click", () => {
            toggleDifficultWord(word);
        });

        grid.appendChild(card);
    });
}

function toggleDifficultWord(word) {
    if (difficultWords.includes(word)) {
        difficultWords = difficultWords.filter(item => item !== word);
    } else {
        difficultWords.push(word);
    }

    saveCurrentPageData();
    renderCurrentWords();
    renderDifficultWords();
}

function renderDifficultWords() {
    const list = document.getElementById("difficultList");
    list.innerHTML = "";

    difficultWords.forEach(word => {
        const item = document.createElement("div");
        item.className = "difficult-word";

        const text = document.createElement("span");
        text.textContent = word;

        const removeButton = document.createElement("button");
        removeButton.type = "button";
        removeButton.className = "remove-button";
        removeButton.textContent = "Remove";

        removeButton.addEventListener("click", () => {
            difficultWords = difficultWords.filter(item => item !== word);
            saveCurrentPageData();
            renderCurrentWords();
            renderDifficultWords();
        });

        item.appendChild(text);
        item.appendChild(removeButton);
        list.appendChild(item);
    });
}

function updateStatus() {
    document.getElementById("status").textContent =
        `Remaining: ${remainingWords.length} | Showing: ${currentWords.length} | Difficult: ${difficultWords.length}`;
}

migrateOldData();
renderPageNavigation();
loadCurrentPageData();
</script>
</body>
</html>
